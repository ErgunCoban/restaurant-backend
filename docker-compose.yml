version: '3.9'

services:

  db:
    image: postgres:15-alpine
    container_name: postgres-db-restaurant

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    restart: unless-stopped

  app:
    build: .
    container_name: spring-app

    ports:
      - "8081:8081"

    depends_on:
      - db

    env_file:
      - .env

    restart: unless-stopped

volumes:
  postgres_data: